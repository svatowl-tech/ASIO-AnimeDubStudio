[package]
name = "dubstudio"
version = "1.2.0"
description = "DubStudio Pro - Professional Dubbing and Fan-dubbing Software"
authors = ["DubStudio Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.6.1", features = [] }

[dependencies]
tauri = { version = "2.11.0", features = ["protocol-asset", "devtools"] }
tauri-plugin-dialog = "^2.0.0"
tauri-plugin-updater = "2.0.0"
tauri-plugin-shell = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
crossbeam-channel = "0.5"
tokio = { version = "1.0", features = ["process", "rt-multi-thread"] }
sqlx = { version = "0.7", features = ["runtime-tokio", "sqlite"] }
hound = "3.5"
ringbuf = "0.2"
rayon = "1.8"
regex = "1.10"
uuid = { version = "1.0", features = ["v4", "serde"] }
md5 = "0.7"
zip = "2.2.0"
chrono = "0.4"
ebur128 = "0.1"
rubato = "0.15"


# Required for our audio implementation
# ASIO feature must be explicitly enabled for Steinberg ASIO SDK support (Windows only)
[target.'cfg(windows)'.dependencies]
cpal = { version = "0.15", features = ["asio"] }
windows = { version = "0.58", features = ["Win32_System_Com", "Win32_System_Threading", "Win32_Foundation"] }

[target.'cfg(not(windows))'.dependencies]
cpal = { version = "0.15" }

[features]
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
